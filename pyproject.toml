(
echo [build-system]
echo requires = ["setuptools>=68", "wheel"]
echo build-backend = "setuptools.build_meta"
echo.
echo [project]
echo name = "gpu-workload-benchmarking-suite"
echo version = "0.1.0"
echo description = "Repeatable GPU workload benchmarks for PyTorch/CUDA workloads."
echo readme = "README.md"
echo requires-python = ">=3.10"
echo license = { file = "LICENSE" }
echo authors = [{ name = "Venkata Naga" }]
echo dependencies = [
echo   "typer>=0.12",
echo   "pyyaml>=6.0",
echo   "psutil>=5.9",
echo   "pandas>=2.0",
echo   "matplotlib>=3.7"
echo ]
echo.
echo [project.optional-dependencies]
echo dev = ["pytest>=7.0", "ruff>=0.5", "black>=24.0"]
echo.
echo [project.scripts]
echo benchkit = "benchkit.cli:app"
echo.
echo [tool.black]
echo line-length = 100
echo.
echo [tool.ruff]
echo line-length = 100
echo select = ["E", "F"]()