[metadata]
name = gpu-workload-benchmarking-suite
version = 0.1.0
description = Repeatable GPU workload benchmarks for PyTorch/CUDA workloads.
long_description = file: README.md
long_description_content_type = text/markdown
license_files = LICENSE

[options]
packages = find:
include_package_data = True
python_requires = >=3.10

[options.packages.find]
include = benchkit*
exclude = tests*
